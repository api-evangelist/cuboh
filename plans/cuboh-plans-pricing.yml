description: >-
  Cuboh's published pricing is for its restaurant online-ordering management
  product (the dashboard and tablet), not for API access. Plans are tiered by
  the restaurant's monthly online-ordering revenue: Low-Volume, Mid-Volume,
  and High-Volume, plus a custom Enterprise option for multi-location clients.
  All tiers include a personal onboarding specialist, analytics and reporting,
  unlimited online-ordering platform integrations, one-click integrations,
  multi-location management, unlimited virtual concepts, and 7-day customer
  support. Integration API access (Direct / Connect) is separate and is granted
  to approved technology partners through onboarding and QA certification; no
  public API price is published.
notes: >-
  Prices captured from the Cuboh pricing page (USD; CAD also shown) and are
  subject to change. Enterprise is contact-sales. API access for partners is
  not separately priced on the public site; reconcile partner-program terms
  directly with Cuboh.
sources:
- https://www.cuboh.com/pricing
- https://docs.cuboh.com/direct
- https://docs.cuboh.com/connect
