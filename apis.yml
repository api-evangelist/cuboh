aid: cuboh
url: https://raw.githubusercontent.com/api-evangelist/cuboh/refs/heads/main/apis.yml
name: Cuboh
kind: company
description: Cuboh is a restaurant online-ordering management platform that consolidates
  third-party delivery and pickup orders (DoorDash, Uber Eats, Grubhub, and more)
  onto a single tablet and into the restaurant POS. For technology partners, Cuboh
  exposes partner-gated Direct and Connect integration APIs covering orders, menus,
  merchant locations, and webhooks. API access is provisioned by Cuboh during a
  partner onboarding and QA-certification process; there is no public self-serve
  signup.
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
- Restaurant
- Online Ordering
- Delivery
- POS
- Order Aggregation
