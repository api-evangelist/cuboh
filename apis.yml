  description: Partner-gated order lifecycle integration. Create orders, list orders,
    retrieve a single order, and cancel orders or order groups under the Direct API,
    plus accept, complete, refund, upcharge, and cancel actions under the Connect
    API. Order events are delivered to partner webhook URLs.
