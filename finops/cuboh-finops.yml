description: >-
  FinOps view of Cuboh spend. Cuboh bills restaurants a flat monthly
  subscription tiered by online-ordering revenue (Low / Mid / High volume),
  with custom Enterprise pricing for multi-location clients. This is a flat
  recurring SaaS charge rather than usage-metered API billing. Cuboh's
  integration APIs (Direct / Connect) are provided to approved technology
  partners through a partner program; no public per-call API pricing is
  published, so there is no usage-metered API cost dimension to model.
notes: >-
  Subscription prices are subject to change; verify against the Cuboh pricing
  page. Partner API commercial terms are not public and must be reconciled
  directly with Cuboh.
sources:
- https://www.cuboh.com/pricing
- https://docs.cuboh.com/direct
- https://docs.cuboh.com/connect
