meters:
- name: subscription_fee
  description: >-
    Flat monthly subscription charged per restaurant account, tiered by the
    restaurant's online-ordering revenue band.
  unit: subscription
  aggregation: sum
  dimensions:
  - account
  - tier
- name: location_count
  description: >-
    Number of restaurant locations under a multi-location account, relevant to
    Enterprise custom pricing.
  unit: locations
  aggregation: sum
  dimensions:
  - account
principles:
- name: Visibility
  description: Track the active subscription tier and any per-location charges against the Cuboh invoice.
- name: Allocation
  description: Map the Cuboh subscription to the locations / brands it serves for internal cost allocation.
- name: Optimization
  description: Choose the subscription tier that matches actual online-ordering revenue; revisit as volume changes.
- name: Accountability
  description: Assign an owner for the Cuboh account and review the tier fit periodically.
